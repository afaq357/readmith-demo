<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Demo Sports Game</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #07111f;
  color: white;
  min-height: 100vh;
  padding-bottom: 75px;
}

button {
  font-family: inherit;
  cursor: pointer;
}

/* TOP BAR */
.topbar {
  height: 62px;
  background: #0c1b2d;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  border-bottom: 1px solid #1d3047;
  position: sticky;
  top: 0;
  z-index: 20;
}

.logo {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 2px;
}

.balance {
  background: #132b43;
  padding: 9px 13px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: bold;
}

.balance span {
  color: #49e38a;
}

/* CATEGORY BAR */
.categories {
  display: flex;
  gap: 9px;
  padding: 12px;
  overflow-x: auto;
  background: #091725;
}

.categories::-webkit-scrollbar {
  display: none;
}

.category {
  white-space: nowrap;
  border: 0;
  color: #b9c7d6;
  background: #13253a;
  padding: 10px 17px;
  border-radius: 20px;
  font-weight: bold;
}

.category.active {
  background: #1686ff;
  color: white;
}

/* HOME */
.page {
  display: none;
}

.page.active {
  display: block;
}

.hero {
  margin: 12px;
  min-height: 150px;
  border-radius: 16px;
  background:
    radial-gradient(circle at 80% 20%, #1c8cff55, transparent 35%),
    linear-gradient(135deg, #123a60, #071827);
  padding: 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.hero h1 {
  font-size: 27px;
  margin-bottom: 8px;
}

.hero p {
  color: #b8c7d8;
  font-size: 14px;
}

/* GAME GRID */
.section-title {
  padding: 10px 14px;
  font-size: 19px;
  font-weight: 800;
}

.game-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 11px;
  padding: 0 12px 20px;
}

.game-card {
  min-height: 145px;
  border-radius: 15px;
  padding: 15px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(145deg, #183453, #0c1b2c);
  border: 1px solid #203c58;
}

.game-card .icon {
  font-size: 45px;
  margin-bottom: 10px;
}

.game-card h3 {
  font-size: 16px;
}

.game-card p {
  color: #91a7bc;
  font-size: 12px;
  margin-top: 5px;
}

.play-btn {
  position: absolute;
  right: 10px;
  bottom: 10px;
  border: 0;
  background: #1686ff;
  color: white;
  padding: 7px 12px;
  border-radius: 15px;
  font-weight: bold;
}

/* FOOTBALL GAME */
.game-page {
  padding: 12px;
}

.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.back-btn {
  border: 0;
  background: #14283d;
  color: white;
  padding: 9px 13px;
  border-radius: 10px;
}

.game-title {
  font-size: 19px;
  font-weight: 800;
}

/* SCORE */
.scoreboard {
  background: #0d2034;
  border-radius: 15px;
  padding: 14px;
  text-align: center;
  margin-bottom: 12px;
}

.scoreboard small {
  color: #91a9be;
}

.score {
  font-size: 26px;
  font-weight: 900;
  margin-top: 4px;
}

/* FIELD */
.field {
  width: 100%;
  height: 310px;
  border-radius: 18px;
  position: relative;
  overflow: hidden;
  background:
    repeating-linear-gradient(
      90deg,
      #08783f 0px,
      #08783f 45px,
      #097f43 45px,
      #097f43 90px
    );
  border: 3px solid #2cda7e;
  box-shadow: inset 0 0 50px #001f11;
}

/* FIELD LINES */
.field::before {
  content: "";
  position: absolute;
  width: 88%;
  height: 76%;
  left: 6%;
  top: 12%;
  border: 2px solid rgba(255,255,255,.65);
  border-radius: 3px;
}

.goal {
  position: absolute;
  top: 17px;
  left: 50%;
  transform: translateX(-50%);
  width: 145px;
  height: 70px;
  border: 5px solid white;
  border-bottom: 0;
  background:
    repeating-linear-gradient(90deg, transparent 0 13px, #ffffff33 13px 15px),
    repeating-linear-gradient(0deg, transparent 0 13px, #ffffff33 13px 15px);
}

.goalkeeper {
  position: absolute;
  top: 73px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 45px;
  transition: left .45s ease, transform .45s ease;
  z-index: 5;
}

.ball {
  position: absolute;
  bottom: 35px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 32px;
  z-index: 6;
  transition:
    left .55s cubic-bezier(.2,.8,.2,1),
    bottom .55s cubic-bezier(.2,.8,.2,1),
    transform .55s ease;
}

.player {
  position: absolute;
  bottom: 7px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 47px;
}

/* RESULT */
.result {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.62);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
  z-index: 10;
}

.result.show {
  opacity: 1;
}

.result-box {
  text-align: center;
  background: #10253a;
  padding: 25px 35px;
  border-radius: 18px;
  border: 1px solid #31516e;
}

.result-box h2 {
  font-size: 32px;
  margin-bottom: 7px;
}

.result-box p {
  color: #b8c8d7;
}

/* CONTROLS */
.controls {
  background: #0d1e30;
  border-radius: 16px;
  padding: 15px;
  margin-top: 12px;
}

.control-row {
  margin-bottom: 15px;
}

.control-row label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: #b9c8d7;
  margin-bottom: 7px;
}

input[type="range"] {
  width: 100%;
  accent-color: #1686ff;
}

.direction-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.direction-buttons button {
  border: 0;
  padding: 11px 5px;
  background: #172f48;
  color: white;
  border-radius: 9px;
  font-weight: bold;
}

.direction-buttons button.selected {
  background: #1686ff;
}

.kick-btn {
  width: 100%;
  margin-top: 5px;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(90deg, #0d9f58, #18d878);
  color: white;
  font-size: 18px;
  font-weight: 900;
}

.kick-btn:disabled {
  opacity: .45;
}

/* NEXT PLAY */
.next-btn {
  width: 100%;
  margin-top: 10px;
  padding: 13px;
  border: 0;
  border-radius: 11px;
  background: #1686ff;
  color: white;
  font-size: 16px;
  font-weight: bold;
  display: none;
}

.next-btn.show {
  display: block;
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 70px;
  background: #091522;
  border-top: 1px solid #1b3044;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  z-index: 50;
}

.nav-item {
  border: 0;
  background: transparent;
  color: #788da1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 4px;
  font-size: 11px;
}

.nav-item .nav-icon {
  font-size: 21px;
}

.nav-item.active {
  color: #35a2ff;
}

/* RESPONSIVE */
@media (min-width: 700px) {
  body {
    max-width: 700px;
    margin: auto;
    background: #050c14;
  }

  .topbar,
  .bottom-nav {
    max-width: 700px;
    margin: auto;
  }

  .game-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}
</style>
</head>

<body>

<!-- TOP -->
<header class="topbar">
  <div class="logo">DEMO</div>
  <div class="balance">
    Credits: <span id="balance">1000</span>
  </div>
</header>

<!-- HOME PAGE -->
<main id="homePage" class="page active">

  <div class="categories">
    <button class="category active">All Games</button>
    <button class="category">Sports</button>
    <button class="category">Arcade</button>
    <button class="category">Popular</button>
  </div>

  <section class="hero">
    <h1>Game Arena</h1>
    <p>Choose a game and play using demo credits.</p>
  </section>

  <div class="section-title">Games</div>

  <div class="game-grid">

    <div class="game-card">
      <div class="icon">⚽</div>
      <h3>Football Strike</h3>
      <p>Penalty challenge</p>
      <button class="play-btn" onclick="openFootball()">PLAY</button>
    </div>

    <div class="game-card">
      <div class="icon">🏀</div>
      <h3>Basketball</h3>
      <p>Coming soon</p>
    </div>

    <div class="game-card">
      <div class="icon">🎯</div>
      <h3>Target</h3>
      <p>Coming soon</p>
    </div>

    <div class="game-card">
      <div class="icon">🏎️</div>
      <h3>Racing</h3>
      <p>Coming soon</p>
    </div>

  </div>
</main>

<!-- FOOTBALL PAGE -->
<main id="footballPage" class="page game-page">

  <div class="game-header">
    <button class="back-btn" onclick="goHome()">← Back</button>
    <div class="game-title">⚽ Football Strike</div>
    <div></div>
  </div>

  <div class="scoreboard">
    <small>PLAY</small>
    <div class="score">
      <span id="playNumber">1</span> / 5
    </div>
  </div>

  <div class="field">

    <div class="goal"></div>

    <div id="goalkeeper" class="goalkeeper">🧤</div>

    <div id="ball" class="ball">⚽</div>

    <div class="player">🧍</div>

    <div id="result" class="result">
      <div class="result-box">
        <h2 id="resultTitle">GOAL!</h2>
        <p id="resultText">Great shot!</p>
      </div>
    </div>

  </div>

  <div class="controls">

    <div class="control-row">
      <label>
        <span>Power</span>
        <span id="powerValue">70%</span>
      </label>

      <input
        id="power"
        type="range"
        min="20"
        max="100"
        value="70"
        oninput="updatePower()"
      >
    </div>

    <div class="control-row">
      <label>
        <span>Aim Direction</span>
        <span id="directionValue">Center</span>
      </label>

      <div class="direction-buttons">
        <button onclick="setDirection('left', this)">LEFT</button>
        <button class="selected" onclick="setDirection('center', this)">CENTER</button>
        <button onclick="setDirection('right', this)">RIGHT</button>
      </div>
    </div>

    <button id="kickButton" class="kick-btn" onclick="kickBall()">
      ⚽ KICK
    </button>

    <button id="nextButton" class="next-btn" onclick="nextPlay()">
      NEXT PLAY →
    </button>

  </div>

</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">

  <button class="nav-item active" onclick="goHome()">
    <span class="nav-icon">⌂</span>
    <span>HOME</span>
  </button>

  <button class="nav-item">
    <span class="nav-icon">🎁</span>
    <span>PROMO</span>
  </button>

  <button class="nav-item" onclick="openFootball()">
    <span class="nav-icon">⚽</span>
    <span>PLAY</span>
  </button>

  <button class="nav-item">
    <span class="nav-icon">💰</span>
    <span>EARN</span>
  </button>

  <button class="nav-item">
    <span class="nav-icon">👤</span>
    <span>MINE</span>
  </button>

</nav>

<script>

let balance = 1000;
let currentPlay = 1;
let selectedDirection = "center";
let isPlaying = false;

/* OPEN FOOTBALL */
function openFootball() {

  document.getElementById("homePage").classList.remove("active");
  document.getElementById("footballPage").classList.add("active");

  resetPlay();
}

/* HOME */
function goHome() {

  document.getElementById("footballPage").classList.remove("active");
  document.getElementById("homePage").classList.add("active");
}

/* POWER */
function updatePower() {

  const power = document.getElementById("power").value;

  document.getElementById("powerValue").textContent =
    power + "%";
}

/* DIRECTION */
function setDirection(direction, button) {

  if (isPlaying) return;

  selectedDirection = direction;

  document
    .querySelectorAll(".direction-buttons button")
    .forEach(btn => btn.classList.remove("selected"));

  button.classList.add("selected");

  let text = "Center";

  if (direction === "left") text = "Left";
  if (direction === "right") text = "Right";

  document.getElementById("directionValue").textContent = text;
}

/* KICK */
function kickBall() {

  if (isPlaying) return;

  isPlaying = true;

  const kickButton = document.getElementById("kickButton");
  const nextButton = document.getElementById("nextButton");

  kickButton.disabled = true;
  nextButton.classList.remove("show");

  const ball = document.getElementById("ball");
  const goalkeeper = document.getElementById("goalkeeper");

  const power =
    Number(document.getElementById("power").value);

  /*
    Demo outcome:
    stronger shots have a slightly higher chance of scoring.
    This is only a fictional game mechanic.
  */
  const scoreChance = 0.35 + (power / 100) * 0.4;
  const goal = Math.random() < scoreChance;

  /* goalkeeper chooses a random dive */
  const keeperDirection =
    ["left", "center", "right"]
    [Math.floor(Math.random() * 3)];

  /* BALL ANIMATION */
  setTimeout(() => {

    if (selectedDirection === "left") {
      ball.style.left = "22%";
      ball.style.bottom = "235px";
      ball.style.transform =
        "translateX(-50%) rotate(-360deg)";
    }

    else if (selectedDirection === "right") {
      ball.style.left = "78%";
      ball.style.bottom = "235px";
      ball.style.transform =
        "translateX(-50%) rotate(360deg)";
    }

    else {
      ball.style.left = "50%";
      ball.style.bottom = "245px";
      ball.style.transform =
        "translateX(-50%) rotate(360deg)";
    }

    /* KEEPER */
    setTimeout(() => {

      if (keeperDirection === "left") {
        goalkeeper.style.left = "32%";
        goalkeeper.style.transform =
          "translateX(-50%) rotate(-35deg)";
      }

      else if (keeperDirection === "right") {
        goalkeeper.style.left = "68%";
        goalkeeper.style.transform =
          "translateX(-50%) rotate(35deg)";
      }

      else {
        goalkeeper.style.left = "50%";
        goalkeeper.style.transform =
          "translateX(-50%) scale(1.1)";
      }

      /* RESULT */
      setTimeout(() => {

        let finalGoal = goal;

        /*
          If goalkeeper dives toward the selected side,
          chance of save increases.
        */
        if (
          keeperDirection === selectedDirection &&
          Math.random() < 0.65
        ) {
          finalGoal = false;
        }

        showResult(finalGoal);

      }, 450);

    }, 250);

  }, 100);
}

/* RESULT */
function showResult(goal) {

  const result = document.getElementById("result");
  const title = document.getElementById("resultTitle");
  const text = document.getElementById("resultText");

  if (goal) {

    title.textContent = "⚽ GOAL!";
    title.style.color = "#43e58b";
    text.textContent = "Fantastic strike!";

    balance += 50;

  } else {

    title.textContent = "🧤 SAVED!";
    title.style.color = "#ffcf4a";
    text.textContent = "The goalkeeper stopped it.";

  }

  document.getElementById("balance").textContent = balance;

  result.classList.add("show");

  setTimeout(() => {
    result.classList.remove("show");
  }, 1300);

  document.getElementById("nextButton")
    .classList.add("show");

}

/* NEXT PLAY */
function nextPlay() {

  if (currentPlay >= 5) {

    alert(
      "Demo round complete!\n\n" +
      "Your demo credits: " + balance
    );

    currentPlay = 1;

  } else {

    currentPlay++;
  }

  document.getElementById("playNumber").textContent =
    currentPlay;

  resetPlay();
}

/* RESET */
function resetPlay() {

  isPlaying = false;

  const ball = document.getElementById("ball");
  const goalkeeper =
    document.getElementById("goalkeeper");

  ball.style.left = "50%";
  ball.style.bottom = "35px";
  ball.style.transform = "translateX(-50%)";

  goalkeeper.style.left = "50%";
  goalkeeper.style.transform =
    "translateX(-50%)";

  document.getElementById("kickButton").disabled = false;

  document.getElementById("nextButton")
    .classList.remove("show");

  document.getElementById("result")
    .classList.remove("show");
}

</script>

</body>
</html>
